name: Verify and release
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run verify
      - name: Check committed bundle
        run: git diff --exit-code -- main.js
      - name: Check tag matches manifest
        if: startsWith(github.ref, 'refs/tags/')
        run: node -e "if (process.env.GITHUB_REF_NAME !== 'v' + require('./manifest.json').version) process.exit(1)"
      - uses: actions/upload-artifact@v4
        with:
          name: red-beard-weather
          path: |
            main.js
            manifest.json
            styles.css
            LICENSE
  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: red-beard-weather
      - name: Publish installable assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" main.js manifest.json styles.css LICENSE --repo "$GITHUB_REPOSITORY" --title "Red-Beard Weather $GITHUB_REF_NAME" --generate-notes
